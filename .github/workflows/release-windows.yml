name: Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate stable tag and package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must be a stable version such as v1.2.3: $tag"
          }
          $packageVersion = node -p "require('./desktop/package.json').version"
          $tagVersion = $tag.Substring(1)
          if ($packageVersion.Trim() -ne $tagVersion) {
            throw "desktop/package.json version $packageVersion does not match tag $tag"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: interview-assistant-windows-${{ github.ref_name }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: desktop/dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
