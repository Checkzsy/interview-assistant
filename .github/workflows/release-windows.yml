name: Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate stable tag and package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must be a stable version such as v1.2.3: $tag"
          }
          $packageVersion = node -p "require('./desktop/package.json').version"
          $tagVersion = $tag.Substring(1)
          if ($packageVersion.Trim() -ne $tagVersion) {
            throw "desktop/package.json version $packageVersion does not match tag $tag"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r backend/requirements.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Cache the bundled whisper-base model
        uses: actions/cache@v4
        with:
          # Content-addressed HF cache; the key embeds the revision pinned in
          # backend/scripts/bundle_whisper_base.py (bump both together).
          path: ~/.cache/huggingface
          key: whisper-base-${{ hashFiles('backend/scripts/bundle_whisper_base.py') }}
          restore-keys: |
            whisper-base-

      - name: Stage the bundled whisper-base model
        # Only the base model ships offline (~145MB); other sizes download on demand.
        run: python backend/scripts/bundle_whisper_base.py stage --dest backend/assets/whisper-base

      - name: Smoke-test the bundled model offline
        # Proves the staged files transcribe with no Hugging Face access.
        env:
          HF_HUB_OFFLINE: '1'
        run: python backend/scripts/bundle_whisper_base.py smoke --dest backend/assets/whisper-base

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run dist

      - name: Verify the installer contains the whisper model
        shell: pwsh
        run: |
          $root = 'desktop/build/backend'
          $assets = @(
            (Join-Path $root '_internal/assets/whisper-base'),
            (Join-Path $root 'assets/whisper-base')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $assets) {
            throw "Packaged backend is missing assets/whisper-base; refusing to publish a model-less installer"
          }
          foreach ($name in @('config.json', 'model.bin', 'tokenizer.json', 'vocabulary.txt')) {
            $path = Join-Path $assets $name
            if (-not (Test-Path $path)) {
              throw "Packaged whisper model is missing $name"
            }
          }
          $size = (Get-Item (Join-Path $assets 'model.bin')).Length
          if ($size -lt 1000000) {
            throw "Packaged whisper model.bin looks truncated: $size bytes"
          }
          Write-Host "Packaged whisper model OK: $assets ($size bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: interview-assistant-windows-${{ github.ref_name }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: desktop/dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
